<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to flat point</title>
  <!-- 구글 태그(gtag)는 여기 맨 위에 붙여넣기 -->
  <style>
    html, body { margin: 0; padding: 0; }
    body { background: #F2F2F2; }               /* PC 좌우 여백 색 (유의사항 배경색에 맞춤) */
    .page { max-width: 560px; margin: 0 auto; }  /* PC에서는 가운데 최대 560px */
    .page img { display: block; width: 100%; height: auto; }
    .page a { display: block; }
  </style>
</head>
<body>
  <main class="page">
    <!-- 1. 메인 -->
    <img src="images/01-main.jpg" width="361" height="2576" alt="Welcome to flat point. 신규회원 첫 구매 5만원 적립금 지급, 구매 고객 추첨 아르덴미러 증정">

    <!-- 2. 버튼 (테스트용: 메인 주소. 실제 가입 페이지 주소는 [확인 필요]) -->
    <a href="https://flatpoint.co.kr">
      <img src="images/02-btn.jpg" width="1079" height="422" alt="혜택 받고 신규회원 되기" loading="lazy">
    </a>

    <!-- 3. 유의사항 -->
    <img src="images/03-notice.jpg" width="1079" height="1826" alt="유의사항" loading="lazy">
  </main>
</body>
</html>
